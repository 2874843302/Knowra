services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowra
      POSTGRES_USER: knowra
      POSTGRES_PASSWORD: ${KNOWRA_POSTGRES_PASSWORD:?Set KNOWRA_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${KNOWRA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - knowra-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowra -d knowra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  knowra-postgres:
